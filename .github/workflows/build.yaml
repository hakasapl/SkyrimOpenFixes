name: Build OpenFixes

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Lint fixes
              run: python3 tools/lint.py

    build:
        runs-on: windows-2022

        steps:
            - uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: amd64

            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Check OpenFixes.ini and README are up to date
              run: |
                  python tools/gen_ini.py --check

            - name: Build Artifact
              run: |
                  ./buildRelease.ps1

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: OpenFixes-${{ github.sha }}
                  path: dist
