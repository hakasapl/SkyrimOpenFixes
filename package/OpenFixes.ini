; OpenFixes settings
; Each line turns one fix on (true) or off (false). A fix that is off installs nothing, as if it wasn't there.
; The comment on each line names the bug it fixes, then the mod the fix comes from and its author(s).
; Fixes marked with game versions ([SE], [AE], [1.7], [VR]) only exist for those versions and do nothing on others.
; A fix whose original mod (or another mod with the same fix) is installed is skipped automatically; the log says so.

[General]
DebugLogging = false ; Log every patched address to OpenFixes.log

[Crashes]
DeadLightInLightQueue = true           ; Crash when the light-queue pass evaluates a destroyed light or one without an NiLight - Shadow Scene Node Crash Fix by Bottle
DestroyedLightStillInSceneLists = true ; Crash when a destroyed light, room or portal is still in the scene's light lists - Shadow Scene Node Crash Fix by Bottle
InstanceGroupCullingRace = true        ; Crash in tree LOD and grass culling while instance groups are added or removed - LOD Refresh Bug Fix by Bottle
MapLODLeakOnWorldChange = true         ; Previous worldspace's world-map LOD stays loaded after changing worldspace (memory leak) - LOD Refresh Bug Fix by Bottle
QueuedAttachAfterCellUnload = false    ; Background-loaded 3D attached to a reference whose cell has already unloaded - Shadow Scene Node Crash Fix by Bottle

[Graphics]
StaleLODAfterTeleport = true ; Old distant LOD never unloads after fast travel, a long teleport or a worldspace change - LOD Refresh Bug Fix by Bottle
